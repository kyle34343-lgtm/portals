<!DOCTYPE html>
<html lang="en">
<head>

  <title>Duckduckgo | Direct Scope & Price Estimator</title>

    body { background: #06090e; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; }

    .btn { width: 100%; background: #f59e0b; color: #000; font-weight: 900; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-size: 14px; text-transform: uppercase; }
  </style>
</head>

      <input type="hidden" name="access_key" value="952d346b-6311-403f-bdd7-1c585d2afe94">
      <input type="hidden" name="subject" value="🚨 DIRECT LEAD DISPATCH: Duckduckgo">
